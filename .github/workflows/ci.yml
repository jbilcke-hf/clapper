name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - improve-comfyui-integration-5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-validation:
    name: App validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: |
          bun run build:clap
          bun run build:timeline
          bun run build:client
          bun run build:io
          bun run build:colors
          bun run build:engine
          bun run build:broadway
          bun run build:clapper-services

      - name: Typecheck app
        run: bunx tsc --noEmit -p packages/app/tsconfig.json

      - name: Test app
        run: bun run --cwd packages/app test
